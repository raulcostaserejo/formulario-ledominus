<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Resposta Enviada - Le Dominus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
            color: #111111;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
        }

        .container {
            max-width: 620px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #000000;
            color: #ffffff;
            margin-bottom: 28px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #111111;
            line-height: 1.3;
            margin-bottom: 16px;
        }

        p {
            color: rgba(0, 0, 0, 0.6);
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn-whatsapp {
            background-color: #111111;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 36px;
            font-size: 18px;
            font-weight: 500;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        }

        .btn-whatsapp:hover {
            background-color: #2b2b2b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 26px;
            }

            p {
                font-size: 16px;
                margin-bottom: 28px;
            }

            .btn-whatsapp {
                width: 100%;
                justify-content: center;
                padding: 14px 24px;
                font-size: 17px;
            }

            .icon-circle {
                width: 70px;
                height: 70px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-circle">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
        </div>

        <h1>Sua resposta foi enviada!</h1>
        <p>Em breve nossa equipe entrará em contato com você. Clique no botão abaixo se quiser passar na frente da fila e falar diretamente com o nosso time.</p>

        <a href="https://wa.me/5561981568995" target="_blank" rel="noopener" class="btn-whatsapp">
            Falar com especialista
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
        </a>
    </div>
</body>
</html>
